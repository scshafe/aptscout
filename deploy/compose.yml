# PROPOSED stack for the owner's review (docs/deploy.md). Not used by CI.
# The owner session turns this into the infra stack: it decides the host paths,
# the tailnet node in front of `server`, the secrets and the image pins.
services:
  server:
    build: ..
    restart: unless-stopped
    environment:
      APTSCOUT_PUBLIC_URL: https://aptscout.<tailnet>.ts.net
      APTSCOUT_OIDC_ISSUER: ${APTSCOUT_OIDC_ISSUER}
      APTSCOUT_OIDC_CLIENT_ID: ${APTSCOUT_OIDC_CLIENT_ID}
      APTSCOUT_OIDC_CLIENT_SECRET: ${APTSCOUT_OIDC_CLIENT_SECRET}
      APTSCOUT_SESSION_SECRET: ${APTSCOUT_SESSION_SECRET}
      APTSCOUT_NOMINATIM_URL: http://nominatim:8080
      APTSCOUT_VALHALLA_URL: http://valhalla:8002
      APTSCOUT_OTP_URL: http://otp:8080
    volumes:
      - ${APTSCOUT_HOST_DATA}:/data
    depends_on: [valhalla, nominatim, otp]

  jobs:        # nightly backup, weekly CTA feed, monthly OSM (aptscout/jobs.py)
    build: ..
    restart: unless-stopped
    command: ["python", "-m", "aptscout", "jobs"]
    environment:
      APTSCOUT_BACKUP_DIR: /backup
    volumes:
      - ${APTSCOUT_HOST_DATA}:/data
      - ${APTSCOUT_HOST_BACKUP}:/backup

  nominatim:   # geocoding from the Illinois extract (design 3.5)
    image: mediagis/nominatim:5.3
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/north-america/us/illinois-updates/
    volumes:
      - ${APTSCOUT_HOST_SERVICES}/nominatim:/var/lib/postgresql/16/main

  valhalla:    # walking, bike and drive times (design 4.2); tiles built from the clipped extract
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest   # OWNER: pin a tag or digest before use
    restart: unless-stopped
    environment:
      tile_urls: https://download.geofabrik.de/north-america/us/illinois-latest.osm.pbf
    volumes:
      - ${APTSCOUT_HOST_SERVICES}/valhalla:/custom_files

  otp:         # CTA schedule routing (design 4.2); inputs from `python -m aptscout build-otp-inputs`
    image: opentripplanner/opentripplanner:2.11.0
    restart: unless-stopped
    command: ["--load", "--serve"]    # the graph is built once with --build --save, see docs/deploy.md
    environment:
      JAVA_TOOL_OPTIONS: -Xmx3g
    volumes:
      - ${APTSCOUT_HOST_DATA}/cache/otp:/var/opentripplanner

# The stack's data (stack.toml, schema 1). The host's tools/stack reads it as
# data, never as shell, and rejects an unknown key; `dev check` (DEPLOY-03)
# checks the same schema. Secrets are named here and never valued: the owner's
# provisioning places them on the host (`stack env-set aptscout NAME`). Infra's
# stacks/aptscout/host.conf grants what this file cannot (host paths, loopback
# ports, groups).
schema = 1

[deploy]
image = "aptscout"                   # the image built from this repository's Dockerfile
pin = "APTSCOUT_IMAGE"               # the .env variable stack deploy writes (name:tag)
pin_style = "ref"
dockerfile = "Dockerfile"
containers = ["aptscout", "aptscout-jobs"]   # both run the candidate image and must be ready
health = "/healthz"                  # probed at the tailnet name (no sign-in, no data)
ready_attempts = 20
# The two services on the app's image; never the sidecar (the node identity) or
# the rebuildable data services.
rollback_services = ["aptscout", "jobs"]

[check]
required_health_services = ["aptscout"]

[backup]
tailscale = true                     # the node identity (always, with a sidecar)
# The owner's data: state/data (aptscout.sqlite and photos/; the datasets'
# cache is the separate state/cache and is rebuilt, not backed up) and
# state/backup, the jobs service's nightly SQLite online-backup copies (a
# consistent copy even if the live file is caught mid-write) and photo mirror.
# Both belong to the app's uid; stack-backup reads them through its one-shot
# read-only container. .env holds the client and session secrets.
paths = ["state/data", "state/backup", ".env"]

[env]
# APTSCOUT_PUBLIC_URL https://aptscout.<tailnet>, APTSCOUT_OIDC_ISSUER
# https://id.<tailnet>, APTSCOUT_OIDC_HOST id.<tailnet> and ID_TAILNET_IP the id
# node's tailscale IPv4 (pinned in the sidecar's /etc/hosts), the Pocket ID
# client `aptscout` (redirect <public URL>/auth/callback), and the owner's OIDC
# subject (APTSCOUT_ALLOWED_SUBJECTS).
required = ["TS_AUTHKEY", "APTSCOUT_PUBLIC_URL", "APTSCOUT_OIDC_ISSUER", "APTSCOUT_OIDC_HOST", "ID_TAILNET_IP", "APTSCOUT_OIDC_CLIENT_ID", "APTSCOUT_OIDC_CLIENT_SECRET", "APTSCOUT_ALLOWED_SUBJECTS"]
# Made on the host (openssl rand -hex 32 into `stack env-set`), never seen.
generated = ["APTSCOUT_SESSION_SECRET"]
owner = []
